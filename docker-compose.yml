services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cornershop_backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    container_name: cornershop_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
